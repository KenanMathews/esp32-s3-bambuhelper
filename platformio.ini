; BambuHelper - Bambu Lab Printer Monitor
; Target: Waveshare ESP32-S3-Touch-LCD-1.28 (GC9A01A 240x240 round, CST816S touch)

; =============================================================================
;  Waveshare ESP32-S3-Touch-LCD-1.28
; =============================================================================
[env:waveshare_esp32s3_gc9a01]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash, 2MB PSRAM — DIO flash mode required for this board
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.filesystem = littlefs

extra_scripts = pre:tools/exclude_helium.py
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; Lua 5.4: copy source files to lib/lua54/src/ and add -DLUA_AVAILABLE to build_flags
    ; Download from https://www.lua.org/ftp/lua-5.4.7.tar.gz
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TFT_eWidget@^0.0.6
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    lvgl/lvgl@^9.4
    ; BLE — NimBLE uses ~25KB heap vs ~60KB for default Arduino BLE (critical with WiFi+MQTT TLS)
    h2zero/NimBLE-Arduino@^1.4.2
    ; IMU — QMI8658 6-axis on shared I2C bus (GPIO6/GPIO7)
    lewisxhe/SensorLib@^0.2

build_flags =
    ; ── TFT_eSPI base (replaces common_flags — ST7789 intentionally omitted) ──
    -I include
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; ── USB Serial (S3 native USB CDC) ──
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ── GC9A01A driver ──
    -D GC9A01_DRIVER=1
    ; ── SPI pins — Waveshare ESP32-S3-Touch-LCD-1.28 ──
    -D TFT_MOSI=11
    -D TFT_SCLK=10
    -D TFT_CS=9
    -D TFT_DC=8
    -D TFT_RST=14
    -D TFT_BL=2
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_MISO=-1
    ; ESP32-S3: use FSPI (SPI2) with GPIO matrix
    -D USE_FSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    ; ── CST816S touch I2C pins (fixed on Waveshare board) ──
    -D TOUCH_SDA=6
    -D TOUCH_SCL=7
    -D TOUCH_INT=5
    -D TOUCH_RST=13
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LUA_AVAILABLE=1
    -D LUA_32BITS=1
    ; BLE coexistence with WiFi (NimBLE)
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1